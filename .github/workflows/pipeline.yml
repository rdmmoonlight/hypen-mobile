name: Hypen Mobile CI/CD Pipeline

on:
  push:
    branches: [ main, production ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ====================================================
  # PROSES MAIN: LINTING & AUTO-FIX
  # ====================================================
  lint-and-fix:
    name: Code Formatting & Quality Check
    if: github.ref_name == 'main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Web Dependencies
        run: |
          if [ -f "apps/web/Hypen.csproj" ]; then 
            dotnet restore apps/web/Hypen.csproj
          fi

      - name: Run Dotnet Format Fix
        continue-on-error: true
        run: |
          if [ -f "apps/web/Hypen.csproj" ]; then 
            dotnet format whitespace apps/web/Hypen.csproj --no-restore
            dotnet format style apps/web/Hypen.csproj --no-restore --severity info
          fi

      - name: Revert Generated Files
        run: |
          git checkout -- **/obj/** **/bin/** 2>/dev/null || true

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(ci): auto-fix code style and linting [skip ci]"
          branch: main
          file_pattern: 'apps/**/*.cs apps/**/*.razor'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          internal_git_options: '-c rebase.autoStash=true'

  # ====================================================
  # PROSES PRODUCTION: END-TO-END BUILD & PUBLISH APK
  # ====================================================
  build-and-publish-apk:
    name: Full Build, Validate & Publish APK
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Generate Version Name & Tag
      - name: Calculate Version
        id: versioning
        run: |
          YEAR=$(date +'%y')
          MONTH=$(date +'%m')
          BUILD_NUM=${{ github.run_number }}
          
          VERSION_NAME="${YEAR}.${MONTH}.${BUILD_NUM}"
          TAG_NAME="v${VERSION_NAME}"
          
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      # 2. Setup Build Environment
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      - name: Aggressive Clean Build Artifacts
        run: |
          set -e
          dotnet clean HypenMaui.csproj -c Release --verbosity minimal || true
          rm -rf bin obj
          rm -rf ~/.nuget/packages/microsoft.maui* || true
          dotnet nuget locals all --clear || true
          echo "✓ Build artifacts cleaned successfully"

      # 3. Signing Keystore Preparation
      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diset."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD belum diset."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Secret ANDROID_KEY_ALIAS belum diset."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEY_PASSWORD belum diset."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > hypen-release.keystore

      # 4. Compile APK
      - name: Compile & Publish Release APK
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet restore HypenMaui.csproj -p:TargetFramework=net10.0-android36.1
          
          dotnet build HypenMaui.csproj -c Release -f net10.0-android36.1 --no-restore \
            -p:RuntimeIdentifier=android-arm64 \
            -p:ApplicationDisplayVersion="${{ steps.versioning.outputs.version_name }}" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:LASTFM_KEY="${LASTFM_KEY:-dummy_key}" \
            -p:LASTFM_SECRET="${LASTFM_SECRET:-dummy_secret}" \
            -p:GoogleClientId="${GOOGLE_CLIENT_ID:-dummy_client_id}" \
            -p:GoogleClientSecret="${GOOGLE_CLIENT_SECRET:-dummy_client_secret}" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$(pwd)/hypen-release.keystore" \
            -p:AndroidSigningKeyAlias="${ANDROID_KEY_ALIAS}" \
            -p:AndroidSigningStorePass="${ANDROID_KEYSTORE_PASSWORD}" \
            -p:AndroidSigningKeyPass="${ANDROID_KEY_PASSWORD}"

      - name: Clean Up Keystore File
        if: always()
        run: |
          if [ -f "hypen-release.keystore" ]; then
            rm -f hypen-release.keystore
          fi

      # 5. Validate APK
      - name: Validate APK & Prepare Final Release Asset
        run: |
          mkdir -p release-assets
          
          # Percabangan Pencarian File APK
          SIGNED_APK=$(find bin/Release/net10.0-android* -type f -name "*-Signed.apk" 2>/dev/null | head -n 1)
          UNSIGNED_APK=$(find bin/Release/net10.0-android* -type f -name "*.apk" 2>/dev/null | head -n 1)

          if [ -n "$SIGNED_APK" ]; then
            echo "--- APK Signed ditemukan ---"
            APK_FILE="$SIGNED_APK"
          elif [ -n "$UNSIGNED_APK" ]; then
            echo "--- APK Signed tidak ditemukan, menggunakan APK standar ---"
            APK_FILE="$UNSIGNED_APK"
          else
            echo "::error::File APK tidak ditemukan!"
            ls -R bin/Release/net10.0-android* || true
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK Selected: $APK_FILE ($FILE_SIZE bytes)"
          
          # Percabangan Validasi Ukuran File
          MIN_SIZE=10485760 # 10MB
          if [ "$FILE_SIZE" -ge "$MIN_SIZE" ]; then
            echo "✓ Ukuran APK valid ($FILE_SIZE bytes)"
            cp "$APK_FILE" "release-assets/HypenVault-${{ steps.versioning.outputs.tag_name }}.apk"
          else
            echo "::error::Ukuran APK terlalu kecil ($FILE_SIZE bytes), batas minimal $MIN_SIZE bytes."
            exit 1
          fi

      # 6. Upload Build Artifact (Agar muncul di halaman log Actions Run)
      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HypenVault-APK-${{ steps.versioning.outputs.tag_name }}
          path: release-assets/*.apk
          retention-days: 7

      # 7. Prepare Release Metadata & Notes
      - name: Generate Release Notes & Metadata
        id: release_info
        run: |
          META_TEXT="Build ID: ${{ github.run_number }} | Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"
          echo "build_meta=${META_TEXT}" >> $GITHUB_OUTPUT
          
          {
            echo "body<<EOF"
            echo "### 🚀 Release Highlights"
            echo "- Offline Local Music Vault Player"
            echo "- Personal Cloud Vault (Google Drive & TeraBox Integration)"
            echo "- Integrated Last.fm Scrobbler"
            echo "- AppShell Navigation Bar System"
            echo "- Automatic In-App Updating"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # 8. Publish Official GitHub Release
      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Hypen Vault ${{ steps.versioning.outputs.tag_name }}
          body: |
            **Version:** ${{ steps.versioning.outputs.tag_name }}
            **Metadata:** ${{ steps.release_info.outputs.build_meta }}

            ${{ steps.release_info.outputs.body }}
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
